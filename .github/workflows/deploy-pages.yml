name: Deploy ChatGPT Build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: chatgpt-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VITE_CHANNEL: beta
    steps:
      - name: Check out application source
        uses: actions/checkout@v4
        with:
          repository: steph1420/stall-tokens
          ref: chatgpt/beta-work
          path: source

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: source/package-lock.json

      - name: Install dependencies
        working-directory: source
        run: npm ci

      - name: Run full project checks
        working-directory: source
        run: npm run check

      - name: Stamp source revision
        working-directory: source
        run: echo "VITE_GIT_SHA=$(git rev-parse --short HEAD)" >> "$GITHUB_ENV"

      - name: Build
        working-directory: source
        run: npm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: source/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
