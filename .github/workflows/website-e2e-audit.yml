name: Website E2E Audit (temporary)

on:
  push:
    branches: [fix/issue-1-and-e2e-audit]

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      VITE_CHANNEL: beta
      BETA_URL: http://127.0.0.1:4173/
      CHROME_PATH: /usr/bin/google-chrome
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Regenerate and verify design tokens
        run: npm run tokens && git diff --exit-code src/tokens
      - name: Full project checks
        run: npm run check
      - name: Confirm browser
        run: google-chrome --version
      - name: Build isolated Beta site
        run: npm run build
      - name: Start local preview
        run: |
          npm run preview -- --host 127.0.0.1 > /tmp/stall-preview.log 2>&1 &
          for attempt in $(seq 1 30); do
            if curl -fsS "$BETA_URL" >/dev/null; then
              echo "Preview is responding at $BETA_URL"
              exit 0
            fi
            sleep 2
          done
          cat /tmp/stall-preview.log
          exit 1
      - name: Run browser workflows and responsive matrix (synthetic data only)
        shell: bash
        run: |
          mkdir -p artifacts/beta-live artifacts/beta-p2 artifacts/beta-p3 artifacts/beta-p4 artifacts/beta-pay artifacts/beta-tablet artifacts/beta-calc-sizes artifacts/beta-sizes
          failed=0
          run_suite() {
            local name="$1"
            shift
            local log="artifacts/$name.log"
            echo "::group::E2E $name"
            set +e
            "$@" 2>&1 | tee "$log"
            local rc=${PIPESTATUS[0]}
            set -e
            local bad
            bad=$(grep -c '^FAIL |' "$log" || true)
            echo "E2E_RESULT $name exit=$rc explicit_failures=$bad"
            if [ "$rc" -ne 0 ] || [ "$bad" -gt 0 ]; then failed=1; fi
            echo "::endgroup::"
          }
          set -e
          run_suite beta-live node e2e/beta-live.mjs artifacts/beta-live
          run_suite beta-p2 node e2e/beta-p2.mjs artifacts/beta-p2
          run_suite beta-p3 node e2e/beta-p3.mjs artifacts/beta-p3
          run_suite beta-p4 node e2e/beta-p4.mjs artifacts/beta-p4
          run_suite beta-pay node e2e/beta-pay.mjs artifacts/beta-pay
          run_suite beta-tablet node e2e/beta-tablet.mjs artifacts/beta-tablet
          run_suite beta-calc-sizes node e2e/beta-calc-sizes.mjs artifacts/beta-calc-sizes

          echo "::group::E2E beta-sizes"
          set +e
          node e2e/beta-sizes.mjs artifacts/beta-sizes 2>&1 | tee artifacts/beta-sizes.log
          rc=${PIPESTATUS[0]}
          set -e
          if [ "$rc" -ne 0 ]; then failed=1; fi
          node --input-type=module - artifacts/beta-sizes.log <<'NODE'
          import fs from 'node:fs';
          const path = process.argv[2];
          const rows = fs.readFileSync(path, 'utf8').split(/\r?\n/).filter(x => x.startsWith('{')).map(x => JSON.parse(x));
          const bad = rows.filter(r => r.err || r.hscroll || (r.off?.length ?? 0) > 0 || (r.small?.length ?? 0) > 0 || r.overlap > 0 || r.bottomBelow > 0 || r.confirmInView === false || r.pillsFit === false);
          console.log(`SIZE_RESULT rows=${rows.length} findings=${bad.length}`);
          for (const r of bad) console.log(JSON.stringify(r));
          if (rows.length === 0 || bad.length > 0) process.exitCode = 1;
          NODE
          size_rc=$?
          if [ "$size_rc" -ne 0 ]; then failed=1; fi
          echo "::endgroup::"

          if [ "$failed" -ne 0 ]; then
            echo "::error::One or more browser suites reported failures or responsive findings."
            exit 1
          fi
          echo "All browser suites passed."
      - name: Upload browser logs and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stall-tokens-fix-e2e-audit
          path: artifacts/
          if-no-files-found: warn
          retention-days: 7
