<body data-theme="utopian-night" data-density="stage">
  <div class="app" id="app">
    <header class="topbar">
      <div>
        <div class="dl-eyebrow" id="wordmark">Stall Tokens</div>
        <h1 id="stall-title">Fair stall</h1>
      </div>
      <div class="dl-muted dl-num" id="clock"></div>
    </header>
    <div class="views" id="views">
      <section class="view is-on" id="view-order" data-view="order"></section>
      <section class="view" id="view-queue" data-view="queue"></section>
      <section class="view" id="view-serving" data-view="serving"></section>
      <section class="view" id="view-menu" data-view="menu"></section>
      <section class="view" id="view-day" data-view="day"></section>
      <section class="view" id="view-settings" data-view="settings"></section>
    </div>
    <nav class="dl-dock" id="dock" aria-label="Main"></nav>
  </div>
  <div id="confirm" class="hidden" role="dialog" aria-modal="true" aria-labelledby="confirm-token"></div>
  <div id="modal-root"></div>
  <div class="dl-toast-region" id="toasts"></div>
  <script>

(function () {
  "use strict";

  /* ========================================================================
   * Store — event-sourced data layer
   *
   * Every order and menu change is an event with a unique id, this device's
   * id, and a timestamp. State is always a reduction of the event log.
   *
   * Sync is not built yet, but the hook is ready for later Bluetooth and
   * internet adapters:
   *   Store.exportEvents()          — events to push
   *   Store.importEvents(remote)    — merge by id, sort by (ts, id), re-reduce
   *   Store.setSyncAdapter(adapter) — adapter.push / adapter.pull
   *   Store.getDeviceId()
   *   Store.onChange(cb)
   * ======================================================================== */
  const STORAGE_KEY = "stall-tokens.v1";
  const UI_KEY = "stall-tokens.ui.v1";

  const EVENT = {
    SETTINGS_SET: "settings.set",
    MENU_ADD: "menu.add",
    MENU_UPDATE: "menu.update",
    MENU_REMOVE: "menu.remove",
    MENU_REORDER: "menu.reorder",
    ORDER_PLACED: "order.placed",
    ORDER_READY: "order.ready",
    ORDER_COLLECTED: "order.collected",
    ORDER_UNDO: "order.undo",
    DAY_STARTED: "day.started",
    TOKEN_RESET: "token.reset"
  };

  const SAMPLE_MENU = [
    { name: "Tea", price: 20, colour: "#38bdf8" },
    { name: "Coffee", price: 30, colour: "#c084fc" },
    { name: "Samosa", price: 15, colour: "#fbbf24" },
    { name: "Vada Pav", price: 25, colour: "#fb7185" },
    { name: "Cold Drink", price: 40, colour: "#34d399" }
  ];
  const SWATCHES = ["#38bdf8", "#4f46e5", "#34d399", "#fbbf24", "#fb7185", "#c084fc", "#fb923c", "#e0f7fc"];

  function uuid() {
    if (crypto.randomUUID) return crypto.randomUUID();
    const b = new Uint8Array(16);
    crypto.getRandomValues(b);
    b[6] = (b[6] & 0x0f) | 0x40;
    b[8] = (b[8] & 0x3f) | 0x80;
    const h = [...b].map((x) => x.toString(16).padStart(2, "0")).join("");
    return h.slice(0, 8) + "-" + h.slice(8, 12) + "-" + h.slice(12, 16) + "-" + h.slice(16, 20) + "-" + h.slice(20);
  }

  function defaultSettings() {
    return { stallName: "Fair stall", currency: "₹", tokenStart: 1 };
  }

  function emptyState() {
    return {
      settings: defaultSettings(),
      menu: [],
      orders: [],
      nextToken: 1,
      dayId: null,
      dayStartedAt: null,
      lastUndoable: null
    };
  }

  function reduce(events) {
    const s = emptyState();
    for (const ev of events) {
      const p = ev.payload || {};
      switch (ev.type) {
        case EVENT.SETTINGS_SET:
          if (p.stallName != null) s.settings.stallName = String(p.stallName);
          if (p.currency != null) s.settings.currency = String(p.currency);
          if (p.tokenStart != null) s.settings.tokenStart = Math.max(1, parseInt(p.tokenStart, 10) || 1);
          break;
        case EVENT.MENU_ADD:
          if (!s.menu.some((i) => i.itemId === p.itemId)) {
            s.menu.push({
              itemId: p.itemId,
              name: p.name,
              price: Number(p.price) || 0,
              colour: p.colour || "#38bdf8",
              soldOut: !!p.soldOut,
              sort: p.sort != null ? p.sort : s.menu.length
            });
            s.menu.sort((a, b) => a.sort - b.sort);
          }
          break;
        case EVENT.MENU_UPDATE: {
          const item = s.menu.find((i) => i.itemId === p.itemId);
          if (item) {
            if (p.name != null) item.name = p.name;
            if (p.price != null) item.price = Number(p.price) || 0;
            if (p.colour != null) item.colour = p.colour;
            if (p.soldOut != null) item.soldOut = !!p.soldOut;
          }
          break;
        }
        case EVENT.MENU_REMOVE:
          s.menu = s.menu.filter((i) => i.itemId !== p.itemId);
          break;
        case EVENT.MENU_REORDER:
          (p.itemIds || []).forEach((id, i) => {
            const it = s.menu.find((x) => x.itemId === id);
            if (it) it.sort = i;
          });
          s.menu.sort((a, b) => a.sort - b.sort);
          break;
        case EVENT.DAY_STARTED:
          s.dayId = p.dayId;
          s.dayStartedAt = ev.ts;
          s.nextToken = p.tokenStart != null ? p.tokenStart : s.settings.tokenStart;
          s.lastUndoable = null;
          break;
        case EVENT.TOKEN_RESET:
          s.nextToken = p.tokenStart != null ? p.tokenStart : s.settings.tokenStart;
          break;
        case EVENT.ORDER_PLACED:
          s.orders.push({
            orderId: p.orderId,
            dayId: p.dayId,
            token: p.token,
            lines: p.lines || [],
            payment: p.payment,
            cashGiven: p.cashGiven,
            change: p.change,
            total: p.total,
            status: "open",
            placedAt: ev.ts,
            readyAt: null,
            collectedAt: null
          });
          if (typeof p.token === "number") s.nextToken = p.token + 1;
          s.lastUndoable = { type: EVENT.ORDER_PLACED, orderId: p.orderId, token: p.token };
          break;
        case EVENT.ORDER_READY: {
          const o = s.orders.find((x) => x.orderId === p.orderId);
          if (o && o.status === "open") {
            o.status = "ready";
            o.readyAt = ev.ts;
            s.lastUndoable = { type: EVENT.ORDER_READY, orderId: p.orderId };
          }
          break;
        }
        case EVENT.ORDER_COLLECTED: {
          const o = s.orders.find((x) => x.orderId === p.orderId);
          if (o && (o.status === "ready" || o.status === "open")) {
            const from = o.status;
            o.status = "collected";
            o.collectedAt = ev.ts;
            s.lastUndoable = { type: EVENT.ORDER_COLLECTED, orderId: p.orderId, from: from };
          }
          break;
        }
        case EVENT.ORDER_UNDO: {
          const o = s.orders.find((x) => x.orderId === p.orderId);
          if (!o) break;
          if (p.undoType === EVENT.ORDER_PLACED) {
            o.status = "cancelled";
            if (p.restoreToken && o.token === s.nextToken - 1) s.nextToken = o.token;
          } else if (p.undoType === EVENT.ORDER_READY) {
            o.status = "open";
            o.readyAt = null;
          } else if (p.undoType === EVENT.ORDER_COLLECTED) {
            o.status = p.from || "ready";
            o.collectedAt = null;
          }
          s.lastUndoable = null;
          break;
        }
        default:
          break;
      }
    }
    return s;
  }

  const Store = {
    deviceId: null,
    events: [],
    state: emptyState(),
    _listeners: [],
    _syncAdapter: null,

    init: function () {
      let raw = null;
      try { raw = JSON.parse(localStorage.getItem(STORAGE_KEY) || "null"); } catch (e) { raw = null; }
      if (raw && raw.deviceId && Array.isArray(raw.events)) {
        this.deviceId = raw.deviceId;
        this.events = raw.events.slice();
      } else {
        this.deviceId = "dev_" + uuid();
        this.events = this._seedEvents();
        this._persist();
      }
      this.events.sort(this._cmp);
      this.state = reduce(this.events);
      if (!this.state.dayId) {
        this.append(EVENT.DAY_STARTED, { dayId: "day_" + uuid(), tokenStart: this.state.settings.tokenStart });
      }
    },

    _seedEvents: function () {
      const ts = Date.now();
      const dayId = "day_" + uuid();
      const evs = [
        this._make(EVENT.SETTINGS_SET, defaultSettings(), ts),
        this._make(EVENT.DAY_STARTED, { dayId: dayId, tokenStart: 1 }, ts + 1)
      ];
      const dev = this.deviceId;
      SAMPLE_MENU.forEach(function (item, i) {
        evs.push({
          id: uuid(),
          deviceId: dev,
          ts: ts + 2 + i,
          type: EVENT.MENU_ADD,
          payload: { itemId: "item_" + uuid(), name: item.name, price: item.price, colour: item.colour, soldOut: false, sort: i }
        });
      });
      return evs;
    },

    _make: function (type, payload, ts) {
      return { id: uuid(), deviceId: this.deviceId, ts: ts || Date.now(), type: type, payload: payload || {} };
    },

    _cmp: function (a, b) {
      return (a.ts - b.ts) || String(a.id).localeCompare(String(b.id));
    },

    _persist: function () {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify({ version: 1, deviceId: this.deviceId, events: this.events }));
      } catch (e) {
        console.warn("Could not save", e);
      }
    },

    _notify: function () {
      const snap = this.state;
      this._listeners.forEach(function (fn) { try { fn(snap); } catch (e) {} });
      if (this._syncAdapter && typeof this._syncAdapter.push === "function") {
        try { this._syncAdapter.push(this.events); } catch (e) {}
      }
    },

    append: function (type, payload) {
      const ev = this._make(type, payload);
      this.events.push(ev);
      this._persist();
      this.state = reduce(this.events);
      this._notify();
      return ev;
    },

    getState: function () { return this.state; },
    getDeviceId: function () { return this.deviceId; },
    exportEvents: function () { return this.events.slice(); },

    importEvents: function (remoteEvents) {
      if (!Array.isArray(remoteEvents) || !remoteEvents.length) return 0;
      const seen = new Set(this.events.map(function (e) { return e.id; }));
      let added = 0;
      for (let i = 0; i < remoteEvents.length; i++) {
        const ev = remoteEvents[i];
        if (!ev || !ev.id || seen.has(ev.id)) continue;
        this.events.push(ev);
        seen.add(ev.id);
        added++;
      }
      if (added) {
        this.events.sort(this._cmp);
        this._persist();
        this.state = reduce(this.events);
        this._notify();
      }
      return added;
    },

    setSyncAdapter: function (adapter) {
      this._syncAdapter = adapter || null;
      if (this._syncAdapter && typeof this._syncAdapter.start === "function") {
        try { this._syncAdapter.start(this); } catch (e) {}
      }
    },
    getSyncAdapter: function () { return this._syncAdapter; },

    onChange: function (fn) {
      this._listeners.push(fn);
      const self = this;
      return function () {
        const i = self._listeners.indexOf(fn);
        if (i >= 0) self._listeners.splice(i, 1);
      };
    },

    todayOrders: function () {
      const dayId = this.state.dayId;
      return this.state.orders.filter(function (o) { return o.dayId === dayId && o.status !== "cancelled"; });
    }
  };

  function loadUi() {
    try { return Object.assign({ view: "order", cart: {}, payment: "cash", cashGiven: "", confirmOrderId: null }, JSON.parse(localStorage.getItem(UI_KEY) || "{}")); }
    catch (e) { return { view: "order", cart: {}, payment: "cash", cashGiven: "", confirmOrderId: null }; }
  }
  function saveUi() {
    try { localStorage.setItem(UI_KEY, JSON.stringify(ui)); } catch (e) {}
  }
  let ui = loadUi();

  const $ = function (sel, root) { return (root || document).querySelector(sel); };
  const $$ = function (sel, root) { return Array.from((root || document).querySelectorAll(sel)); };

  function money(n) {
    const sym = Store.state.settings.currency || "₹";
    const val = Number(n) || 0;
    const body = Math.abs(val % 1) < 1e-9 ? String(Math.round(val)) : val.toFixed(2);
    return sym + body;
  }

  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c];
    });
  }

  function timeOf(ts) {
    try {
      return new Date(ts).toLocaleTimeString("en-GB", { hour: "2-digit", minute: "2-digit", hour12: false, timeZone: "Asia/Calcutta" });
    } catch (e) {
      return new Date(ts).toLocaleTimeString("en-GB", { hour: "2-digit", minute: "2-digit" });
    }
  }

  function cartLines() {
    const menu = Store.state.menu;
    const lines = [];
    Object.keys(ui.cart).forEach(function (id) {
      const qty = ui.cart[id] | 0;
      if (qty <= 0) return;
      const item = menu.find(function (m) { return m.itemId === id; });
      if (!item) return;
      lines.push({ itemId: id, name: item.name, price: item.price, qty: qty, colour: item.colour });
    });
    return lines;
  }

  function cartTotal() {
    return cartLines().reduce(function (s, l) { return s + l.price * l.qty; }, 0);
  }

  function toast(msg) {
    const el = document.createElement("div");
    el.className = "dl-toast";
    el.textContent = msg;
    $("#toasts").appendChild(el);
    setTimeout(function () { el.remove(); }, 2200);
  }

  const ICONS = {
    order: '<svg class="dl-dock__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6h16M4 12h16M4 18h10"/></svg>',
    queue: '<svg class="dl-dock__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><rect x="5" y="3" width="14" height="18" rx="2"/><path d="M8 8h8M8 12h8M8 16h5"/></svg>',
    serving: '<svg class="dl-dock__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="8"/><path d="M12 8v5l3 2"/></svg>',
    menu: '<svg class="dl-dock__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M7 5v14M12 5v14M17 5v14"/><path d="M5 5h4M10 5h4M15 5h4"/></svg>',

  };

  function renderDock() {
    const tabs = [
      ["order", "Order"],
      ["queue", "Queue"],
      ["serving", "Serving"],
      ["menu", "Menu"],
      ["day", "Day"],
      ["settings", "Settings"]
    ];
    const open = Store.todayOrders().filter(function (o) { return o.status === "open" || o.status === "ready"; }).length;
    $("#dock").innerHTML = tabs.map(function (t) {
      const on = ui.view === t[0] ? " is-on" : "";
      const pill = ui.view === t[0] ? '<span class="dl-dock__pill"></span>' : "";
      const badge = t[0] === "queue" && open ? '<span class="dl-dock__badge" data-n="' + open + '">' + open + "</span>" : "";
      return '<button type="button" class="dl-dock__tab' + on + '" data-go="' + t[0] + '" aria-current="' + (ui.view === t[0] ? "page" : "false") + '">' + pill + ICONS[t[0]] + "<span>" + t[1] + "</span>" + badge + "</button>";

  function setView(name) {
    ui.view = name;
    saveUi();
    document.body.classList.toggle("is-serving", name === "serving");
    $$(".view").forEach(function (v) { v.classList.toggle("is-on", v.getAttribute("data-view") === name); });
    renderAll();
  }

  function renderHeader() {
    $("#stall-title").textContent = Store.state.settings.stallName || "Fair stall";
    $("#clock").textContent = timeOf(Date.now());
  }

  function renderOrder() {
    const menu = Store.state.menu;
    const lines = cartLines();
    const total = cartTotal();
    const cash = ui.payment === "cash";
    const given = parseFloat(ui.cashGiven);
    let changeHtml = "";
    if (cash && ui.cashGiven !== "" && !isNaN(given)) {
      const ch = given - total;
      if (ch >= 0) changeHtml = '<div class="change is-ok">Change ' + money(ch) + "</div>";
      else changeHtml = '<div class="change is-short">Need ' + money(-ch) + ' more</div>';
    }
    const items = menu.length ? '<div class="item-grid">' + menu.map(function (item) {
      const qty = ui.cart[item.itemId] || 0;
      const sold = item.soldOut ? " is-sold" : "";
      const inn = qty ? " is-in" : "";
      const badge = qty ? '<span class="badge">' + qty + "</span>" : "";
      const soldLbl = item.soldOut ? '<span class="item-btn__sold">Sold out</span>' : "";
      return '<button type="button" class="item-btn' + sold + inn + '" data-add="' + escapeHtml(item.itemId) + '" style="--item-accent:' + escapeHtml(item.colour) + '"' + (item.soldOut ? " disabled" : "") + ">" +
        '<span class="item-btn__name">' + escapeHtml(item.name) + "</span>" +
        '<span class="item-btn__price">' + money(item.price) + "</span>" + soldLbl + badge + "</button>";
    }).join("") + "</div>" : '<div class="empty">No menu items yet. Add some in Menu.</div>';

    const cartHtml = lines.length ? '<div class="cart">' + lines.map(function (l) {
      return '<div class="cart-line" data-line="' + escapeHtml(l.itemId) + '"><div><div class="cart-line__name">' + escapeHtml(l.name) + '</div><div class="cart-line__meta">' + money(l.price) + " each</div></div>" +
        '<div class="stepper"><button type="button" data-dec="' + escapeHtml(l.itemId) + '" aria-label="Fewer">−</button><span class="qty">' + l.qty + '</span><button type="button" data-inc="' + escapeHtml(l.itemId) + '" aria-label="More">+</button></div>' +
        '<button type="button" class="icon-x" data-rm="' + escapeHtml(l.itemId) + '" aria-label="Remove">×</button></div>';
    }).join("") + "</div>" : "";

    $("#view-order").innerHTML =
      items +
      '<div class="order-foot">' + cartHtml +
        '<div class="dl-seg" role="tablist" aria-label="Payment">' +
          '<button type="button" class="dl-seg__item' + (ui.payment === "cash" ? " is-on" : "") + '" data-pay="cash">' + (ui.payment === "cash" ? '<span class="dl-seg__pill"></span>' : "") + "Cash</button>" +
          '<button type="button" class="dl-seg__item' + (ui.payment === "upi" ? " is-on" : "") + '" data-pay="upi">' + (ui.payment === "upi" ? '<span class="dl-seg__pill"></span>' : "") + "UPI</button>" +
        "</div>" +
        (cash ? '<div class="cash-row field"><label for="cash-given">Amount given (optional)</label><input id="cash-given" inputmode="decimal" type="text" value="' + escapeHtml(ui.cashGiven) + '" placeholder="e.g. 100">' + changeHtml + "</div>" : "") +
        '<div class="total-row"><span class="label">Total</span><span class="sum">' + money(total) + "</span></div>" +
        '<button type="button" class="dl-btn dl-btn--primary dl-btn--block" id="place-order"' + (lines.length ? "" : " disabled") + ">Place order</button>" +
      "</div>";
  }

  function renderQueue() {
    const orders = Store.todayOrders().filter(function (o) { return o.status === "open" || o.status === "ready"; })
      .sort(function (a, b) { return a.placedAt - b.placedAt; });
    const undo = Store.state.lastUndoable;
    let html = '<div style="display:flex;justify-content:space-between;align-items:center;gap:12px"><p class="section-title" style="margin:0">Open queue</p>' +
      '<button type="button" class="dl-btn dl-btn--quiet" id="undo-last"' + (undo ? "" : " disabled") + ">Undo last action</button></div>";
    if (!orders.length) html += '<div class="empty">No open orders. Place one from the Order tab.</div>';
    html += orders.map(function (o) {
      const lines = (o.lines || []).map(function (l) {
        return "<li><span>" + escapeHtml(l.qty) + " × " + escapeHtml(l.name) + "</span><span class=\"dl-num\">" + money(l.price * l.qty) + "</span></li>";
      }).join("");
      const readyBtn = o.status === "open" ? '<button type="button" class="dl-btn dl-btn--positive" data-ready="' + escapeHtml(o.orderId) + '">Ready</button>' : "";
      const colBtn = '<button type="button" class="dl-btn dl-btn--primary" data-collect="' + escapeHtml(o.orderId) + '">Collected</button>';
      return '<article class="dl-card dl-card--glass q-card is-' + o.status + '"><div class="q-card__top"><div class="q-token dl-num">' + o.token + '</div><div class="q-meta"><div class="q-status">' + (o.status === "ready" ? "Ready" : "Preparing") + "</div><div class=\"dl-muted dl-num\">" + timeOf(o.placedAt) + " · " + (o.payment === "upi" ? "UPI" : "Cash") + "</div></div></div>" +
        "<ul class=\"q-lines\">" + lines + "</ul>" +
        '<div class="total-row"><span class="label">Total</span><span class="dl-num" style="font-size:22px;font-weight:700">' + money(o.total) + "</span></div>" +
        '<div class="q-actions">' + readyBtn + colBtn + "</div></article>";
    }).join("");
    $("#view-queue").innerHTML = html;
  }

  function renderServing() {
    const ready = Store.todayOrders().filter(function (o) { return o.status === "ready"; })
      .sort(function (a, b) { return (a.readyAt || 0) - (b.readyAt || 0); });
    const many = ready.length > 2 ? " is-many" : "";
    const nums = ready.length
      ? '<div class="serve-grid' + many + '">' + ready.map(function (o) { return '<div class="serve-num dl-num">' + o.token + "</div>"; }).join("") + "</div>"
      : '<div class="serve-empty">No tokens ready just now</div>';
    $("#view-serving").innerHTML = '<button type="button" class="serve-exit" data-go="queue">Exit</button><div class="serve"><div class="serve__label">Now serving</div>' + nums + "</div>";
  }

  function renderMenu() {
    const rows = Store.state.menu.map(function (item, idx) {
      const sold = item.soldOut ? " is-sold" : "";
      return '<div class="dl-card dl-card--glass menu-row' + sold + '" style="--item-accent:' + escapeHtml(item.colour) + '"><span class="swatch"></span><div><div class="menu-row__name">' + escapeHtml(item.name) + "</div><div class=\"dl-muted dl-num\">" + money(item.price) + (item.soldOut ? " · Sold out" : "") + '</div></div><div class="menu-row__tools">' +
        '<button type="button" data-move="' + escapeHtml(item.itemId) + '" data-dir="-1" aria-label="Move up"' + (idx === 0 ? " disabled" : "") + ">↑</button>" +
        '<button type="button" data-move="' + escapeHtml(item.itemId) + '" data-dir="1" aria-label="Move down"' + (idx === Store.state.menu.length - 1 ? " disabled" : "") + ">↓</button>" +
        '<button type="button" data-edit="' + escapeHtml(item.itemId) + '">Edit</button>' +
        '<button type="button" data-sold="' + escapeHtml(item.itemId) + '">' + (item.soldOut ? "On sale" : "Sold out") + "</button>" +
        "</div></div>";
    }).join("") || '<div class="empty">No items yet.</div>';
    $("#view-menu").innerHTML = '<p class="section-title">Menu items</p>' + rows +
      '<button type="button" class="dl-btn dl-btn--primary dl-btn--block" id="add-item">Add item</button>';
  }

  function renderDay() {
    const orders = Store.todayOrders();
    const placed = orders.length;
    const cash = orders.filter(function (o) { return o.payment === "cash"; }).reduce(function (s, o) { return s + (o.total || 0); }, 0);
    const upi = orders.filter(function (o) { return o.payment === "upi"; }).reduce(function (s, o) { return s + (o.total || 0); }, 0);
    const qtys = {};
    orders.forEach(function (o) {
      (o.lines || []).forEach(function (l) {
        if (!qtys[l.name]) qtys[l.name] = 0;
        qtys[l.name] += l.qty;
      });
    });
    const qtyRows = Object.keys(qtys).length
      ? "<ul class=\"q-lines\">" + Object.keys(qtys).sort().map(function (n) { return "<li><span>" + escapeHtml(n) + '</span><span class="dl-num">' + qtys[n] + "</span></li>"; }).join("") + "</ul>"
      : '<div class="dl-muted">No items sold yet today.</div>';
    $("#view-day").innerHTML =
      '<p class="section-title">Today\'s takings</p>' +
      '<div class="stats"><div class="dl-card dl-card--glass stat"><span class="v dl-num">' + placed + '</span><span class="k">Orders</span></div>' +
      '<div class="dl-card dl-card--glass stat"><span class="v dl-num">' + money(cash + upi) + '</span><span class="k">Total</span></div>' +
      '<div class="dl-card dl-card--glass stat"><span class="v dl-num">' + money(cash) + '</span><span class="k">Cash</span></div>' +
      '<div class="dl-card dl-card--glass stat"><span class="v dl-num">' + money(upi) + '</span><span class="k">UPI</span></div></div>' +
      '<p class="section-title">Quantity per item</p><div class="dl-card dl-card--glass">' + qtyRows + "</div>" +
      '<button type="button" class="dl-btn dl-btn--secondary dl-btn--block" id="export-csv">Export CSV</button>' +
      '<button type="button" class="dl-btn dl-btn--danger dl-btn--block" id="new-day">Start new day</button>';
  }

  function renderSettings() {
    const s = Store.state.settings;
    $("#view-settings").innerHTML =
      '<p class="section-title">Stall</p>' +
      '<div class="field"><label for="set-name">Stall name</label><input id="set-name" type="text" value="' + escapeHtml(s.stallName) + '"></div>' +
      '<div class="field"><label for="set-currency">Currency symbol</label><input id="set-currency" type="text" maxlength="4" value="' + escapeHtml(s.currency) + '"></div>' +
      '<div class="field"><label for="set-token">Token start number</label><input id="set-token" inputmode="numeric" type="number" min="1" step="1" value="' + escapeHtml(s.tokenStart) + '"></div>' +
      '<button type="button" class="dl-btn dl-btn--primary dl-btn--block" id="save-settings">Save settings</button>' +
      '<button type="button" class="dl-btn dl-btn--secondary dl-btn--block" id="reset-tokens">Reset token counter</button>' +
      '<p class="section-title">This device</p>' +
      '<div class="dl-card dl-card--glass"><div class="dl-muted">Device id (used later for Bluetooth and internet sync)</div><div class="dev-id">' + escapeHtml(Store.getDeviceId()) + "</div>" +
      '<div class="dl-faint" style="margin-top:8px">Next token: <span class="dl-num">' + Store.state.nextToken + "</span></div></div>" +
      '<p class="dl-faint">Add this page to your home screen for a full-screen stall app. Data stays on this device until sync is added.</p>';
  }

  function renderConfirm() {
    const box = $("#confirm");
    if (!ui.confirmOrderId) { box.classList.add("hidden"); box.innerHTML = ""; return; }
    const o = Store.state.orders.find(function (x) { return x.orderId === ui.confirmOrderId; });
    if (!o) { ui.confirmOrderId = null; saveUi(); box.classList.add("hidden"); return; }
    const lines = (o.lines || []).map(function (l) { return escapeHtml(l.qty) + " × " + escapeHtml(l.name); }).join(" · ");
    const pay = o.payment === "upi" ? "UPI" : "Cash";
    const extra = o.payment === "cash" && o.cashGiven != null && o.change != null ? '<div class="dl-muted">Given ' + money(o.cashGiven) + " · Change " + money(o.change) + "</div>" : "";
    box.classList.remove("hidden");
    box.innerHTML = '<div class="confirm-kicker">Your token</div><div class="confirm-token dl-num" id="confirm-token">' + o.token + "</div>" +
      '<div class="confirm-lines">' + lines + "</div>" +
      '<div class="confirm-pay">' + pay + "</div>" +
      '<div class="confirm-total">' + money(o.total) + "</div>" + extra +
      '<button type="button" class="dl-btn dl-btn--primary" id="confirm-done">Done</button>';
  }

  function renderAll() {
    renderHeader();
    renderDock();
    renderOrder();
    renderQueue();
    renderServing();
    renderMenu();
    renderDay();
    renderSettings();
    renderConfirm();
  }

  function addToCart(id) {
    const item = Store.state.menu.find(function (m) { return m.itemId === id; });
    if (!item || item.soldOut) return;
    ui.cart[id] = (ui.cart[id] || 0) + 1;
    saveUi();
    renderOrder();
    renderHeader();
    renderDock();
  }

  function setQty(id, qty) {
    if (qty <= 0) delete ui.cart[id];
    else ui.cart[id] = qty;
    saveUi();
    renderOrder();
  }

  function placeOrder() {
    const lines = cartLines();
    if (!lines.length) return;
    const total = cartTotal();
    const payment = ui.payment === "upi" ? "upi" : "cash";
    let cashGiven = null, change = null;
    if (payment === "cash" && ui.cashGiven !== "" && !isNaN(parseFloat(ui.cashGiven))) {
      cashGiven = parseFloat(ui.cashGiven);
      change = cashGiven - total;
    }
    const token = Store.state.nextToken;
    const orderId = "ord_" + uuid();
    Store.append(EVENT.ORDER_PLACED, {
      orderId: orderId,
      dayId: Store.state.dayId,
      token: token,
      lines: lines.map(function (l) { return { itemId: l.itemId, name: l.name, price: l.price, qty: l.qty }; }),
      payment: payment,
      cashGiven: cashGiven,
      change: change,
      total: total
    });
    ui.cart = {};
    ui.cashGiven = "";
    ui.confirmOrderId = orderId;
    saveUi();
    renderAll();
  }

  function undoLast() {
    const u = Store.state.lastUndoable;
    if (!u) return;
    const o = Store.state.orders.find(function (x) { return x.orderId === u.orderId; });
    if (!o) return;
    Store.append(EVENT.ORDER_UNDO, {
      orderId: u.orderId,
      undoType: u.type,
      from: u.from,
      restoreToken: u.type === EVENT.ORDER_PLACED
    });
    toast("Undone");
    renderAll();
  }

  function exportCsv() {
    const orders = Store.todayOrders();
    const rows = [["Token", "Time", "Status", "Payment", "Items", "Total", "Cash given", "Change"]];
    orders.forEach(function (o) {
      const items = (o.lines || []).map(function (l) { return l.qty + "x " + l.name; }).join("; ");
      rows.push([o.token, timeOf(o.placedAt), o.status, o.payment, items, o.total, o.cashGiven == null ? "" : o.cashGiven, o.change == null ? "" : o.change]);
    });
    const csv = rows.map(function (r) {
      return r.map(function (c) {
        const s = String(c == null ? "" : c);
        return /[",\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
      }).join(",");
    }).join("\n");
    const blob = new Blob(["\ufeff" + csv], { type: "text/csv;charset=utf-8" });
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = "stall-tokens-day.csv";
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(function () { URL.revokeObjectURL(a.href); }, 500);
  }

  function openModal(title, bodyHtml, footHtml) {
    const root = $("#modal-root");
    root.innerHTML = '<div class="dl-scrim" data-close-modal></div><div class="dl-sheet" role="dialog" aria-modal="true"><div class="dl-sheet__grab"></div><div class="dl-sheet__head"><h2>' + title + '</h2><button type="button" class="dl-btn dl-btn--quiet" style="min-height:48px;min-width:48px" data-close-modal aria-label="Close">×</button></div><div class="dl-sheet__body">' + bodyHtml + '</div><div class="dl-sheet__foot">' + footHtml + "</div></div>";
  }
  function closeModal() { $("#modal-root").innerHTML = ""; }

  function itemForm(item) {
    const colour = (item && item.colour) || SWATCHES[0];
    const sw = SWATCHES.map(function (c) {
      return '<button type="button" data-swatch="' + c + '" style="background:' + c + '" class="' + (c === colour ? "is-on" : "") + '" aria-label="Colour ' + c + '"></button>';
    }).join("");
    openModal(item ? "Edit item" : "Add item",
      '<div class="field"><label for="item-name">Name</label><input id="item-name" type="text" value="' + escapeHtml(item ? item.name : "") + '"></div>' +
      '<div class="field"><label for="item-price">Price</label><input id="item-price" inputmode="decimal" type="text" value="' + escapeHtml(item ? String(item.price) : "") + '"></div>' +
      '<div class="field"><label>Colour</label><div class="swatch-pick" id="item-colour" data-colour="' + escapeHtml(colour) + '">' + sw + "</div></div>" +
      (item ? '<button type="button" class="dl-btn dl-btn--danger dl-btn--block" id="delete-item" data-del="' + escapeHtml(item.itemId) + '">Delete item</button>' : ""),
      '<button type="button" class="dl-btn dl-btn--secondary" data-close-modal>Cancel</button>' +
      '<button type="button" class="dl-btn dl-btn--primary" id="save-item" data-id="' + (item ? escapeHtml(item.itemId) : "") + '">Save</button>'
    );
    setTimeout(function () { const n = $("#item-name"); if (n) n.focus(); }, 50);
  }

  function confirmNewDay() {
    openModal("Start a new day?",
      "<p>This clears today's orders from the queue and summary, and resets the token counter to the start number (" + Store.state.settings.tokenStart + "). The event log is kept so later sync can still merge history.</p>",
      '<button type="button" class="dl-btn dl-btn--secondary" data-close-modal>Cancel</button>' +
      '<button type="button" class="dl-btn dl-btn--danger" id="confirm-new-day">Start new day</button>'
    );
  }

  function startNewDay() {
    Store.append(EVENT.DAY_STARTED, { dayId: "day_" + uuid(), tokenStart: Store.state.settings.tokenStart });
    ui.cart = {};
    ui.cashGiven = "";
    ui.confirmOrderId = null;
    saveUi();
    closeModal();
    toast("New day started");
    setView("order");
  }

  document.addEventListener("click", function (e) {
    const t = e.target.closest("[data-go],[data-add],[data-inc],[data-dec],[data-rm],[data-pay],[data-ready],[data-collect],[data-edit],[data-sold],[data-move],[data-swatch],[data-close-modal],#place-order,#confirm-done,#undo-last,#add-item,#save-item,#delete-item,#export-csv,#new-day,#confirm-new-day,#save-settings,#reset-tokens");
    if (!t) return;

    if (t.hasAttribute("data-go")) { setView(t.getAttribute("data-go")); return; }
    if (t.hasAttribute("data-add")) { addToCart(t.getAttribute("data-add")); return; }
    if (t.hasAttribute("data-inc")) { const id = t.getAttribute("data-inc"); setQty(id, (ui.cart[id] || 0) + 1); return; }
    if (t.hasAttribute("data-dec")) { const id = t.getAttribute("data-dec"); setQty(id, (ui.cart[id] || 1) - 1); return; }
    if (t.hasAttribute("data-rm")) { setQty(t.getAttribute("data-rm"), 0); return; }
    if (t.hasAttribute("data-pay")) { ui.payment = t.getAttribute("data-pay"); saveUi(); renderOrder(); return; }
    if (t.id === "place-order") { placeOrder(); return; }
    if (t.id === "confirm-done") { ui.confirmOrderId = null; saveUi(); renderConfirm(); return; }
    if (t.hasAttribute("data-ready")) { Store.append(EVENT.ORDER_READY, { orderId: t.getAttribute("data-ready") }); renderAll(); return; }
    if (t.hasAttribute("data-collect")) { Store.append(EVENT.ORDER_COLLECTED, { orderId: t.getAttribute("data-collect") }); renderAll(); return; }
    if (t.id === "undo-last") { undoLast(); return; }
    if (t.id === "add-item") { itemForm(null); return; }
    if (t.hasAttribute("data-edit")) {
      const item = Store.state.menu.find(function (m) { return m.itemId === t.getAttribute("data-edit"); });
      if (item) itemForm(item);
      return;
    }
    if (t.hasAttribute("data-sold")) {
      const item = Store.state.menu.find(function (m) { return m.itemId === t.getAttribute("data-sold"); });
      if (item) Store.append(EVENT.MENU_UPDATE, { itemId: item.itemId, soldOut: !item.soldOut });
      renderAll();
      return;
    }
    if (t.hasAttribute("data-move")) {
      const id = t.getAttribute("data-move");
      const dir = parseInt(t.getAttribute("data-dir"), 10);
      const ids = Store.state.menu.map(function (m) { return m.itemId; });
      const i = ids.indexOf(id);
      const j = i + dir;
      if (i < 0 || j < 0 || j >= ids.length) return;
      const tmp = ids[i]; ids[i] = ids[j]; ids[j] = tmp;
      Store.append(EVENT.MENU_REORDER, { itemIds: ids });
      renderAll();
      return;
    }
    if (t.hasAttribute("data-swatch")) {
      $$(".swatch-pick button").forEach(function (b) { b.classList.remove("is-on"); });
      t.classList.add("is-on");
      const wrap = $("#item-colour");
      if (wrap) wrap.setAttribute("data-colour", t.getAttribute("data-swatch"));
      return;
    }
    if (t.id === "save-item") {
      const name = ($("#item-name") && $("#item-name").value || "").trim();
      const price = parseFloat($("#item-price") && $("#item-price").value);
      const colour = ($("#item-colour") && $("#item-colour").getAttribute("data-colour")) || SWATCHES[0];
      if (!name || isNaN(price) || price < 0) { toast("Enter a name and price"); return; }
      const id = t.getAttribute("data-id");
      if (id) Store.append(EVENT.MENU_UPDATE, { itemId: id, name: name, price: price, colour: colour });
      else Store.append(EVENT.MENU_ADD, { itemId: "item_" + uuid(), name: name, price: price, colour: colour, soldOut: false, sort: Store.state.menu.length });
      closeModal();
      renderAll();
      return;
    }
    if (t.id === "delete-item") {
      Store.append(EVENT.MENU_REMOVE, { itemId: t.getAttribute("data-del") });
      closeModal();
      renderAll();
      toast("Item deleted");
      return;
    }
    if (t.hasAttribute("data-close-modal")) { closeModal(); return; }
    if (t.id === "export-csv") { exportCsv(); return; }
    if (t.id === "new-day") { confirmNewDay(); return; }
    if (t.id === "confirm-new-day") { startNewDay(); return; }
    if (t.id === "save-settings") {
      const stallName = ($("#set-name") && $("#set-name").value || "").trim() || "Fair stall";
      const currency = ($("#set-currency") && $("#set-currency").value || "").trim() || "₹";
      const tokenStart = Math.max(1, parseInt($("#set-token") && $("#set-token").value, 10) || 1);
      Store.append(EVENT.SETTINGS_SET, { stallName: stallName, currency: currency, tokenStart: tokenStart });
      toast("Settings saved");
      renderAll();
      return;
    }
    if (t.id === "reset-tokens") {
      Store.append(EVENT.TOKEN_RESET, { tokenStart: Store.state.settings.tokenStart });
      toast("Token counter reset to " + Store.state.settings.tokenStart);
      renderAll();
      return;
    }
  });

  document.addEventListener("input", function (e) {
    if (e.target && e.target.id === "cash-given") {
      ui.cashGiven = e.target.value;
      saveUi();
      const total = cartTotal();
      const given = parseFloat(ui.cashGiven);
      const row = e.target.parentElement;
      let el = row.querySelector(".change");
      if (ui.cashGiven === "" || isNaN(given)) { if (el) el.remove(); return; }
      const ch = given - total;
      if (!el) { el = document.createElement("div"); el.className = "change"; row.appendChild(el); }
      if (ch >= 0) { el.className = "change is-ok"; el.textContent = "Change " + money(ch); }
      else { el.className = "change is-short"; el.textContent = "Need " + money(-ch) + " more"; }
    }
  });

  document.addEventListener("focusin", function (e) {
    if (e.target && (e.target.id === "cash-given" || e.target.id === "item-price")) {
      try { e.target.select(); } catch (err) {}
    }
  });

  Store.init();
  if (ui.view === "serving") document.body.classList.add("is-serving");
  renderAll();
  setInterval(function () { $("#clock").textContent = timeOf(Date.now()); }, 15000);
  window.StallStore = Store;
})();
  </script>
</body>
</html>
